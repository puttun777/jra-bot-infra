name: aws-secrets-init
# AWS: 乱数の秘密（DB のパスワード・Cookie・ペッパー・KEK・ビーコンとモデルの署名鍵）を SSM の SecureString に作る。
# **既にあるものは上書きしない**（再実行しても安全）。値は表示しない。Discord の Webhook は本人が CloudShell で入れる（docs/AWS_OPERATIONS.md U6）。
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ops-aws-host
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  init:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ops
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_OPS_ROLE_ARN }}
      CONTROLLER_FUNCTION: ${{ vars.AWS_CONTROLLER_FUNCTION }}
      SSM_PREFIX: ${{ vars.AWS_SSM_PREFIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ops
      - name: secrets-init
        working-directory: ops
        run: node ../build/ops/src/aws/cli.js secrets-init | tee -a "$GITHUB_STEP_SUMMARY"
